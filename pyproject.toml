[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pdfnest"
version = "0.2.5"
description = "PDFNest: a PySide6 PDF reader with anchored external Markdown notes."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "PySide6>=6.7",
    "PyMuPDF>=1.24",
    "Markdown>=3.6",
]

[project.scripts]
pdfnest = "pdf_notes_reader.main:main"
pdf-notes-reader = "pdf_notes_reader.main:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
pdf_notes_reader = ["assets/*.png"]
