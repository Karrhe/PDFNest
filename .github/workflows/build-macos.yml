name: Build macOS app

# Builds PDFNest.app (arm64 for Apple Silicon and x86_64 for Intel Macs) with
# scripts/build_macos_app.sh. Pushing a tag such as v0.3.0 also attaches the .dmg files to the
# GitHub Release for that tag (creating the release if needed).
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Version for the file names (default: version in pyproject.toml)"
        required: false
        default: ""

permissions:
  contents: write

jobs:
  build:
    name: macOS ${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-latest      # Apple Silicon
            arch: arm64
          - runner: macos-15-intel    # Intel
            arch: x86_64
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pyinstaller pytest pikepdf pypdf

      # Reported but not blocking: the suite is developed on Windows, so a macOS-only test quirk
      # should show up here without holding back the build.
      - name: Run tests (offscreen)
        continue-on-error: true
        env:
          QT_QPA_PLATFORM: offscreen
        run: python -m pytest -q -m "not slow"

      - name: Build PDFNest.app and .dmg
        env:
          PYTHON: python
        run: |
          VERSION="${{ github.event.inputs.version }}"
          if [[ -z "$VERSION" && "${GITHUB_REF_TYPE}" == "tag" ]]; then
            VERSION="${GITHUB_REF_NAME#v}"
          fi
          bash scripts/build_macos_app.sh $VERSION

      - uses: actions/upload-artifact@v4
        with:
          name: PDFNest-macos-${{ matrix.arch }}
          path: |
            release/*.dmg
            release/*.zip
          if-no-files-found: error

  release:
    name: Attach to GitHub Release
    if: startsWith(github.ref, 'refs/tags/')
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.dmg
            dist/*.zip
          fail_on_unmatched_files: false
